name: Build SYNAX APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "Android-App/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "Android-App/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: synax-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate repository layout
        shell: bash
        run: |
          set -euo pipefail
          test -f Android-App/settings.gradle.kts || { echo "ERROR: Android-App/settings.gradle.kts is missing. Upload the contents of the build package to the repository root, not inside another nested folder."; exit 1; }
          test -f Android-App/app/build.gradle.kts || { echo "ERROR: Android-App/app/build.gradle.kts is missing."; exit 1; }
          test -f Android-App/app/src/main/AndroidManifest.xml || { echo "ERROR: Android manifest is missing."; exit 1; }
          echo "Repository layout looks correct."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show build tool versions
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Build debug APK with detailed log
        working-directory: Android-App
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --info :app:assembleDebug 2>&1 | tee ../gradle-build.log

      - name: Verify and name APK
        shell: bash
        run: |
          set -euo pipefail
          APK="Android-App/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || { echo "ERROR: Gradle finished without creating the expected APK at $APK"; exit 1; }
          cp "$APK" synax.apk
          ls -lh synax.apk

      - name: Upload synax.apk
        uses: actions/upload-artifact@v4
        with:
          name: synax-apk
          path: synax.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle log for debugging
        if: ${{ failure() && hashFiles('gradle-build.log') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: synax-gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 7
