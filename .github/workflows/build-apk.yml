
name: Build SYNAX APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "Android-App/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "Android-App/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: synax-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate repository layout
        shell: bash
        run: |
          set -euo pipefail

          test -f Android-App/settings.gradle.kts || {
            echo "ERROR: Android-App/settings.gradle.kts is missing."
            exit 1
          }

          test -f Android-App/app/build.gradle.kts || {
            echo "ERROR: Android-App/app/build.gradle.kts is missing."
            exit 1
          }

          test -f Android-App/app/src/main/AndroidManifest.xml || {
            echo "ERROR: Android manifest is missing."
            exit 1
          }

          echo "Repository layout looks correct."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # FIX: v4 avoids installing the removed SDK "tools" package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses || {
            echo "SDK license acceptance failed."
            exit 1
          }

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -o pipefail
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            2>&1 | tee sdk-install.log

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show build tool versions
        shell: bash
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Build debug APK with detailed log
        working-directory: Android-App
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --info \
            :app:assembleDebug 2>&1 | tee ../gradle-build.log

      - name: Verify and name APK
        shell: bash
        run: |
          set -euo pipefail

          APK="Android-App/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated at $APK"
            exit 1
          fi

          cp "$APK" synax.apk
          ls -lh synax.apk

      - name: Upload synax.apk
        uses: actions/upload-artifact@v4
        with:
          name: synax-apk
          path: synax.apk
          if-no-files-found: error
          retention-days: 14

      - name: Capture diagnostics after failure
        if: ${{ failure() }}
        continue-on-error: true
        shell: bash
        run: |
          {
            echo "=== Java ==="
            java -version 2>&1 || true

            echo "=== Android environment ==="
            env | grep -E '^(ANDROID|JAVA_HOME|GRADLE)' || true

            echo "=== SDK manager location ==="
            command -v sdkmanager || true

            echo "=== Installed SDK packages ==="
            sdkmanager --list_installed 2>&1 || true
          } | tee sdk-diagnostics.log

      - name: Upload build logs for debugging
        if: ${{ always() && (hashFiles('gradle-build.log') != '' || hashFiles('sdk-install.log') != '' || hashFiles('sdk-diagnostics.log') != '') }}
        uses: actions/upload-artifact@v4
        with:
          name: synax-build-debug-logs
          path: |
            gradle-build.log
            sdk-install.log
            sdk-diagnostics.log
          if-no-files-found: warn
          retention-days: 7
