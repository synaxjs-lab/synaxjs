name: Build SYNAX APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "Android-App/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Compile Android app
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: Android-App
        run: gradle --no-daemon :app:assembleDebug

      - name: Name APK synax.apk
        run: cp Android-App/app/build/outputs/apk/debug/app-debug.apk synax.apk

      - name: Upload synax.apk
        uses: actions/upload-artifact@v4
        with:
          name: synax-apk
          path: synax.apk
          if-no-files-found: error
          retention-days: 14
